<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Thank You — Bodytruth Family Farms Educational Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1a3a1f; --bright-green: #62af41; --amber: #e8a020;
      --teal: #2a8a7e; --white: #ffffff; --warm-white: #fafaf8;
      --near-black: #1a1a1a; --text-muted: #6b6b6b;
      --radius-sm: 6px; --radius-lg: 18px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--forest);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 560px; }
    img.logo { height: 40px; width: auto; margin: 0 auto 3rem; }
    .icon {
      font-size: 3rem; margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Inter', sans-serif; font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: var(--white); letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    h1 em {
      font-family: 'Lora', Georgia, serif;
      font-style: italic; color: var(--bright-green); font-weight: 400;
    }
    p {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 1.1rem; color: rgba(255,255,255,0.75);
      line-height: 1.8; margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600;
      padding: 0.9rem 1.9rem; border-radius: var(--radius-sm);
      border: none; cursor: pointer; transition: all 0.18s ease;
      min-height: 52px; text-decoration: none;
    }
    .btn-green { background: var(--bright-green); color: var(--white); }
    .btn-green:hover { background: #2d6a1f; }
    .footer-stripe {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--bright-green) 0%, var(--teal) 50%, var(--amber) 100%);
    }
  </style>
</head>
<body>
  <div class="container">
    <img
      src="https://bodytruthfarms.com/images/foundation-images/BFFEFInclogoVersion2LongTransparent.png"
      alt="Bodytruth Family Farms Educational Foundation"
      class="logo"
      onerror="this.style.display='none';"
    >
    <div class="icon">🌱</div>
    <h1>Your message is <em>received.</em></h1>
    <p>
      Someone will respond personally within 24 hours. We read every submission — no auto-replies, no form letters. Just a real response from a real person.
    </p>
    <a href="/index.html" class="btn btn-green">Back to Home →</a>
  </div>
  <div class="footer-stripe" aria-hidden="true"></div>
</body>
</html>
